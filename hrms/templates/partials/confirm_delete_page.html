{# 通用删除确认页主体 —— 各模块只需 extends base 后 include 本文件 #}
{# object_label 给被删对象的可读标识；warning 说明删除的影响面，由视图传入 #}

<div class="card" style="max-width: 640px;">
  <div class="card-body">
    <p class="mb-3">
      确定要删除 <strong>{{ object_label }}</strong> 吗？此操作不可撤销。
    </p>

    {% if warning %}
      <div class="alert alert-warning mb-3">
        <i class="bi bi-exclamation-triangle"></i> {{ warning }}
      </div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-danger"><i class="bi bi-trash"></i> 确认删除</button>
        <a href="{% url cancel_url %}" class="btn btn-outline-secondary">取消</a>
      </div>
    </form>
  </div>
</div>
