{% load static %}
{# 登录页 —— 不使用 admin 的登录界面，做成面向业务用户的独立入口 #}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · 人力资源管理系统</title>
  <link rel="stylesheet" href="{% static 'vendor/bootstrap/bootstrap.min.css' %}">
  <link rel="stylesheet" href="{% static 'vendor/bootstrap-icons/bootstrap-icons.min.css' %}">
  <link rel="stylesheet" href="{% static 'css/hrms.css' %}">
</head>
<body class="login-page">
  <div class="login-card">
    <div class="login-brand">
      <i class="bi bi-people-fill"></i>
      <h1>人力资源管理系统</h1>
      <p>HR Management System</p>
    </div>

    {# next 由 LoginView 自动带上，登录后跳回用户原本想访问的页面 #}
    <form method="post" action="{% url 'login' %}">
      {% csrf_token %}

      {% if form.errors %}
        <div class="alert alert-danger py-2" role="alert">
          <i class="bi bi-exclamation-triangle"></i>
          登录名或密码不正确，请重试。
        </div>
      {% endif %}

      <div class="mb-3">
        <label for="{{ form.username.id_for_label }}" class="form-label">工号</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person-badge"></i></span>
          <input type="text" name="{{ form.username.html_name }}"
                 id="{{ form.username.id_for_label }}" class="form-control"
                 placeholder="请输入工号" autocomplete="username" autofocus required>
        </div>
      </div>

      <div class="mb-4">
        <label for="{{ form.password.id_for_label }}" class="form-label">密码</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" name="{{ form.password.html_name }}"
                 id="{{ form.password.id_for_label }}" class="form-control"
                 placeholder="请输入密码" autocomplete="current-password" required>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2">
        <i class="bi bi-box-arrow-in-right"></i> 登 录
      </button>
    </form>

    <div class="login-footer">
      <span>《软件综合实践》课程项目</span>
      <span>王坤尧</span>
    </div>
  </div>
</body>
</html>
